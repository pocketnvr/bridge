services:
  pocketnvr-bridge:
    image: ghcr.io/pocketnvr/bridge:latest
    container_name: pocketnvr-bridge
    restart: unless-stopped
    network_mode: host
    environment:
      FRIGATE_URL: https://192.168.1.20:8971
    volumes:
      - ./pocketnvr-data:/data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
