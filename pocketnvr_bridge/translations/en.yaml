configuration:
  frigate_url:
    name: Frigate URL
    description: Leave empty if Frigate is the Home Assistant add-on (port 8971 enabled in its Network section). Otherwise Frigate's IP and port, e.g. 192.168.1.20:8971. The Bridge finds out by itself whether Frigate answers in HTTP or HTTPS.
  public_host:
    name: Public host
    description: Optional. Dynamic DNS name or static public IP. Detected automatically when empty.
  upnp:
    name: UPnP
    description: Open the UDP port on the router automatically.
  wg_port:
    name: WireGuard port
    description: Optional. UDP port the Bridge listens on. Leave empty and the Bridge takes 51820, or the next free port if another WireGuard add-on uses it.
  public_port:
    name: Public port
    description: Optional. UDP port seen from the Internet, if you forward a different one.
  web_port:
    name: Admin page port
    description: Optional. Admin page port (8765 by default, used by Open web UI). Change it only if another program uses 8765.
  allowed_hosts:
    name: Allowed host names
    description: Optional. Extra host names accepted for the admin page, comma-separated.
network:
  8765/tcp: Admin page (add phones)
  51820/udp: WireGuard
