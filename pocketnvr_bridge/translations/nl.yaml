configuration:
  frigate_url:
    name: Adres van Frigate
    description: Leeg laten als Frigate de add-on van Home Assistant is (poort 8971 ingeschakeld in de sectie Netwerk). Anders het IP-adres en de poort van Frigate, bijvoorbeeld 192.168.1.20:8971. De Bridge herkent zelf of Frigate via HTTP of HTTPS antwoordt.
  public_host:
    name: Openbaar adres
    description: Optioneel. DynDNS-naam of vast openbaar IP-adres. Wordt automatisch gedetecteerd als het leeg is.
  upnp:
    name: UPnP
    description: Opent de UDP-poort op de router automatisch.
  wg_port:
    name: WireGuard-poort
    description: Optioneel. UDP-poort van de Bridge. Leeg laten, dan neemt de Bridge 51820, of de volgende vrije poort als een andere WireGuard-add-on hem al gebruikt.
  public_port:
    name: Openbare poort
    description: Optioneel. UDP-poort zoals gezien vanaf internet, als u een andere doorstuurt.
  web_port:
    name: Poort van de beheerpagina
    description: Optioneel. Poort van de beheerpagina (standaard 8765, gebruikt door "Web-UI openen"). Alleen wijzigen als een ander programma 8765 gebruikt.
  allowed_hosts:
    name: Toegestane hostnamen
    description: Optioneel. Extra namen die voor de beheerpagina worden geaccepteerd, gescheiden door komma's.
network:
  8765/tcp: Beheerpagina (telefoons toevoegen)
  51820/udp: WireGuard
