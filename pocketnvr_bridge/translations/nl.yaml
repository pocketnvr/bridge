configuration:
  frigate_url:
    name: Adres van Frigate
    description: Laat leeg als Frigate de add-on van Home Assistant is (poort 8971 ingeschakeld in de sectie Netwerk ervan). De Bridge gebruikt dan het adres van Home Assistant. Anders het IP-adres van Frigate en poort 8971 (bijv. https://192.168.1.20:8971).
  public_host:
    name: Openbaar adres
    description: Optioneel. DynDNS-naam of vast openbaar IP-adres. Wordt automatisch gedetecteerd als het leeg is.
  upnp:
    name: UPnP
    description: Opent de UDP-poort op de router automatisch.
  wg_port:
    name: WireGuard-poort
    description: Optioneel. UDP-poort waarop de Bridge luistert (standaard 51820).
  public_port:
    name: Openbare poort
    description: Optioneel. UDP-poort zoals gezien vanaf internet, als u een andere doorstuurt.
  web_port:
    name: Poort van de beheerpagina
    description: Optioneel. Poort van de beheerpagina (standaard 8765).
  allowed_hosts:
    name: Toegestane hostnamen
    description: Optioneel. Extra namen die voor de beheerpagina worden geaccepteerd, gescheiden door komma's.
network:
  8765/tcp: Beheerpagina (telefoons toevoegen)
  51820/udp: WireGuard
