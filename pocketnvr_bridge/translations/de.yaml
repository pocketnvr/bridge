configuration:
  frigate_url:
    name: Adresse von Frigate
    description: Leer lassen, wenn Frigate das Add-on von Home Assistant ist (Port 8971 in dessen Abschnitt Netzwerk aktiviert). Sonst IP und Port von Frigate, z. B. 192.168.1.20:8971. Die Bridge erkennt selbst, ob Frigate per HTTP oder HTTPS antwortet.
  public_host:
    name: Öffentliche Adresse
    description: Optional. DynDNS-Name oder feste öffentliche IP. Wird automatisch erkannt, wenn leer.
  upnp:
    name: UPnP
    description: Öffnet den UDP-Port auf dem Router automatisch.
  wg_port:
    name: WireGuard-Port
    description: Optional. UDP-Port der Bridge. Leer lassen, dann nimmt die Bridge 51820 oder den nächsten freien Port, wenn ein anderes WireGuard-Add-on ihn nutzt.
  public_port:
    name: Öffentlicher Port
    description: Optional. Vom Internet aus sichtbarer UDP-Port, falls Sie einen anderen weiterleiten.
  web_port:
    name: Port der Administrationsseite
    description: Optional. Port der Verwaltungsseite (Standard 8765, von „Web-UI öffnen“ verwendet). Nur ändern, wenn ein anderes Programm 8765 nutzt.
  allowed_hosts:
    name: Erlaubte Hostnamen
    description: Optional. Zusätzliche Namen, die für die Administrationsseite akzeptiert werden, durch Kommas getrennt.
network:
  8765/tcp: Administrationsseite (Telefone hinzufügen)
  51820/udp: WireGuard
