configuration:
  frigate_url:
    name: Dirección de Frigate
    description: Déjelo vacío si Frigate es el complemento de Home Assistant (puerto 8971 activado en su sección Red). Si no, la dirección completa con http:// o https:// y el puerto 8971, por ejemplo https://192.168.1.20:8971. Use la IP en lugar de un nombre de dominio, y http:// si el TLS está desactivado en Frigate.
  public_host:
    name: Dirección pública
    description: Opcional. Nombre de DNS dinámico o IP pública fija. Se detecta automáticamente si está vacío.
  upnp:
    name: UPnP
    description: Abre automáticamente el puerto UDP en el router.
  wg_port:
    name: Puerto WireGuard
    description: Opcional. Puerto UDP del Bridge (51820 por defecto). Ponga 51821 si otro complemento WireGuard ya usa el 51820 (el registro muestra «address already in use»).
  public_port:
    name: Puerto público
    description: Opcional. Puerto UDP visto desde Internet, si redirige otro distinto.
  web_port:
    name: Puerto de la página de administración
    description: Opcional. Puerto de la página de administración (8765 por defecto). Ábrala desde la red de casa con la IP local de Home Assistant, http://IP:8765. Un nombre de dominio o Nabu Casa no permite llegar a ella.
  allowed_hosts:
    name: Nombres de host permitidos
    description: Opcional. Nombres adicionales aceptados para la página de administración, separados por comas.
network:
  8765/tcp: Página de administración (añadir teléfonos)
  51820/udp: WireGuard
