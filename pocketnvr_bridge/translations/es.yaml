configuration:
  frigate_url:
    name: Dirección de Frigate
    description: Déjelo vacío si Frigate es el complemento de Home Assistant (puerto 8971 activado en su sección Red). Si no, la IP y el puerto de Frigate, por ejemplo 192.168.1.20:8971. El Bridge detecta solo si Frigate responde en HTTP o HTTPS.
  public_host:
    name: Dirección pública
    description: Opcional. Nombre de DNS dinámico o IP pública fija. Se detecta automáticamente si está vacío.
  upnp:
    name: UPnP
    description: Abre automáticamente el puerto UDP en el router.
  wg_port:
    name: Puerto WireGuard
    description: Opcional. Puerto UDP del Bridge. Déjelo vacío y el Bridge usa el 51820, o el siguiente puerto libre si otro complemento WireGuard ya lo usa.
  public_port:
    name: Puerto público
    description: Opcional. Puerto UDP visto desde Internet, si redirige otro distinto.
  web_port:
    name: Puerto de la página de administración
    description: Opcional. Puerto de la página de administración (8765 por defecto, usado por «Abrir interfaz web»). Cámbielo solo si otro programa usa el 8765.
  allowed_hosts:
    name: Nombres de host permitidos
    description: Opcional. Nombres adicionales aceptados para la página de administración, separados por comas.
network:
  8765/tcp: Página de administración (añadir teléfonos)
  51820/udp: WireGuard
