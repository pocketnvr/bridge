configuration:
  frigate_url:
    name: Indirizzo di Frigate
    description: Lasciare vuoto se Frigate è il componente aggiuntivo di Home Assistant (porta 8971 attivata nella sua sezione Rete). Altrimenti l'IP e la porta di Frigate, per esempio 192.168.1.20:8971. Il Bridge rileva da solo se Frigate risponde in HTTP o HTTPS.
  public_host:
    name: Indirizzo pubblico
    description: Facoltativo. Nome DNS dinamico o IP pubblico fisso. Rilevato automaticamente se vuoto.
  upnp:
    name: UPnP
    description: Apre automaticamente la porta UDP sul router.
  wg_port:
    name: Porta WireGuard
    description: Facoltativo. Porta UDP del Bridge. Lasciare vuoto e il Bridge usa la 51820, o la porta libera successiva se un altro componente WireGuard la usa già.
  public_port:
    name: Porta pubblica
    description: Facoltativo. Porta UDP vista da Internet, se ne inoltra un'altra.
  web_port:
    name: Porta della pagina di amministrazione
    description: Facoltativo. Porta della pagina di amministrazione (8765 per impostazione predefinita, usata da «Apri interfaccia web»). Cambiarla solo se un altro programma usa la 8765.
  allowed_hosts:
    name: Nomi host consentiti
    description: Facoltativo. Nomi aggiuntivi accettati per la pagina di amministrazione, separati da virgole.
network:
  8765/tcp: Pagina di amministrazione (aggiunta dei telefoni)
  51820/udp: WireGuard
